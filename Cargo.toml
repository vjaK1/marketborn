[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-persist",
    "crates/sim-cli",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
rand = "0.8.5"
# Version-pinned per CLAUDE.md: the RNG algorithm is part of the determinism contract.
rand_chacha = "=0.3.1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tauri = "2"
tauri-build = "2"
tempfile = "3"

[profile.release]
lto = "thin"
